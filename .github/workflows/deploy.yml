name: Deploy frontend

on:
  push:
    branches:
      - main
      - staging
      - develop
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'staging' && 'stage' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Supabase configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: scripts/prepare-supabase-env.sh --github-env

      - name: Enable configured Supabase social auth providers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          AUTH_SOCIAL_PROVIDERS: ${{ vars.AUTH_SOCIAL_PROVIDERS || secrets.AUTH_SOCIAL_PROVIDERS || 'google,facebook' }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
          FACEBOOK_OAUTH_CLIENT_ID: ${{ secrets.FACEBOOK_OAUTH_CLIENT_ID }}
          FACEBOOK_OAUTH_CLIENT_SECRET: ${{ secrets.FACEBOOK_OAUTH_CLIENT_SECRET }}
          FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          SUPABASE_AUTH_EXTERNAL_FACEBOOK_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_FACEBOOK_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_FACEBOOK_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_FACEBOOK_SECRET }}
        run: scripts/configure-supabase-auth-providers.sh

      - name: Prepare dist folder
        run: |
          mkdir -p dist
          cp index.html style.css script.js app-config.js favicon.ico bus-green.png bus-red.png dist/

      - name: Inject environment configuration
        env:
          APP_ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'staging' && 'stage' || 'dev' }}
          MONITORING_ENDPOINT: ${{ secrets.MONITORING_ENDPOINT }}
          ERROR_TRACKING_ENDPOINT: ${{ secrets.ERROR_TRACKING_ENDPOINT }}
          AUTH_SOCIAL_PROVIDERS: ${{ vars.AUTH_SOCIAL_PROVIDERS || secrets.AUTH_SOCIAL_PROVIDERS || 'google,facebook' }}
        run: |
          for file in dist/index.html dist/app-config.js; do
            sed -i "s|__APP_ENV__|${APP_ENV}|g" "$file"
            sed -i "s|__SUPABASE_URL__|${SUPABASE_URL}|g" "$file"
            sed -i "s|__SUPABASE_PUBLISHABLE_KEY__|${SUPABASE_PUBLISHABLE_KEY}|g" "$file"
            sed -i "s|__MONITORING_ENDPOINT__|${MONITORING_ENDPOINT}|g" "$file"
            sed -i "s|__ERROR_TRACKING_ENDPOINT__|${ERROR_TRACKING_ENDPOINT}|g" "$file"
            sed -i "s|__AUTH_SOCIAL_PROVIDERS__|${AUTH_SOCIAL_PROVIDERS}|g" "$file"
          done

      - name: Validate placeholders are replaced
        run: |
          ! rg '__(APP_ENV|SUPABASE_URL|SUPABASE_PUBLISHABLE_KEY|MONITORING_ENDPOINT|ERROR_TRACKING_ENDPOINT|AUTH_SOCIAL_PROVIDERS)__' dist/index.html dist/app-config.js

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: hovalett-dist-${{ github.ref_name }}
          path: dist
